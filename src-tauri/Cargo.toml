[package]
name = "tauri-app"
version = "0.1.0"
description = "Inkspire desktop word processor"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tauri-plugin-persisted-scope = "2.4.2"
regex = "1.13.1"
# The built-in engine: download with a checksum, unpack the llama.cpp release, run it as a child process.
tokio = { version = "1", features = ["process", "time", "fs", "io-util", "net", "sync", "rt"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# Pandoc and Typst arrive as .tar.gz, .tar.xz or .zip releases.
zip = { version = "2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
# API keys live in the operating system's keyring (Secret Service on Linux, Keychain, Credential Manager).
keyring = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
default-features = false
features = ["sync-secret-service", "crypto-rust"]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
default-features = false
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
default-features = false
features = ["windows-native"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The webview's own GTK widget, to route touchpad pinch to the document zoom (see pinch.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
