<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <g transform="translate(54 54) scale(0.9) translate(-54 -54)">
  <!-- The mark: a page with lines of text and the AI spark at its corner, inside the 66 dp safe circle. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAFF"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38D3FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#0B1460" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M39 29h20l11 11v34a5 5 0 0 1-5 5H39a5 5 0 0 1-5-5V34a5 5 0 0 1 5-5z" fill="url(#paper)"/>
    <path d="M59 29v7a4 4 0 0 0 4 4h7z" fill="#B9C6F5"/>
  </g>
  <g fill="#3B4FC4" opacity="0.8">
    <rect x="40" y="45" width="22" height="3.6" rx="1.8"/>
    <rect x="40" y="53" width="18" height="3.6" rx="1.8"/>
    <rect x="40" y="61" width="12" height="3.6" rx="1.8"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="68" cy="68" r="13" fill="url(#spark)"/>
  </g>
  <path d="M68 59.5c.9 4.6 3.9 7.6 8.5 8.5-4.6.9-7.6 3.9-8.5 8.5-.9-4.6-3.9-7.6-8.5-8.5 4.6-.9 7.6-3.9 8.5-8.5z" fill="#FFFFFF"/>
  </g>
</svg>
