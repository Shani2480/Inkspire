name: Release

# Builds the installers and attaches them to a GitHub release:
# a .deb and an AppImage (built on Ubuntu 22.04 so they run on older distributions too),
# a Flatpak made from that .deb, a Windows setup .exe (NSIS), a macOS .dmg (Apple Silicon and Intel in one),
# and an Android tablet .apk (from the android branch, signed with the key in the repository's secrets).
# Push a tag such as v0.1.0, or run it by hand with the tag to publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created on the current commit when missing), e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release (or reuse it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Inkspire $TAG" \
              --notes-file .github/release-notes.md

  linux:
    name: Linux (.deb, AppImage)
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev patchelf file
      - run: npm ci
      - run: npm run tauri build -- --bundles deb,appimage
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb

  flatpak:
    name: Flatpak
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: packaging/flatpak
      - name: Name the .deb for the manifest
        run: mv packaging/flatpak/*.deb packaging/flatpak/inkspire.deb
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Inkspire.flatpak
          manifest-path: packaging/flatpak/com.aiword.app.yml
          cache: false
          upload-artifact: false
      - name: Name the bundle
        run: mv Inkspire.flatpak "Inkspire_${TAG#v}_x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Inkspire_*_x86_64.flatpak

  windows:
    name: Windows (setup .exe)
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber

  macos:
    name: macOS (.dmg)
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # One app for Apple Silicon and Intel, signed ad hoc (no Apple Developer ID yet, so not notarized).
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

  android:
    name: Android (.apk)
    needs: draft
    runs-on: ubuntu-latest
    steps:
      # The Android port lives on its own branch until it joins main.
      - uses: actions/checkout@v4
        with:
          ref: android
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Signing key
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/inkspire-release.jks"
          printf 'password=%s\nkeyAlias=inkspire\nstoreFile=%s\n' "$ANDROID_KEY_PASSWORD" "$RUNNER_TEMP/inkspire-release.jks" \
            > src-tauri/gen/android/keystore.properties
      - name: Build (arm64 tablets, and x86_64 for emulators and Chromebooks)
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri android build -- --target aarch64 --target x86_64 --apk
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Inkspire_${TAG#v}_android.apk"
          gh release upload "$TAG" "Inkspire_${TAG#v}_android.apk" --clobber

  publish:
    name: Publish the release
    needs: [linux, flatpak, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" Inkspire_*_x86_64.flatpak --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
